<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>InstaWatch - {{.Title}}</title>
        <link rel="manifest" href="/static/manifest.json" />
        <meta name="theme-color" content="#1a0533" />
        <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
        <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png" />
        <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/css/style.css" />
    </head>

    <body class="player-page">
        <div class="player-container">
            <video
                id="videoPlayer"
                src="{{.VideoURL}}"
                controls
                loop
                playsinline
            ></video>
        </div>

        <a href="/" class="back-link" title="Back to InstaWatch">
            <span class="back-icon">←</span>
            <span>InstaWatch</span>
        </a>

        {{if .HasDescription}}
        <a
            href="{{.DescriptionURL}}"
            class="description-link"
            title="View Description"
        >
            <span class="description-icon">ℹ</span>
            <span>Description</span>
        </a>
        {{end}}

        <button id="copyLinkBtn" class="copy-link-btn" title="Copy link">
            <span class="copy-icon">⧉</span>
            <span class="copy-link-label">Copy Link</span>
        </button>

        <a href="{{.DownloadURL}}" class="download-btn" title="Download video" download>
            <span class="download-icon">↓</span>
            <span class="download-btn-label">Download</span>
        </a>

        <div id="copyToast" class="copy-toast" aria-live="polite"></div>

        <script src="/static/js/player.js" defer></script>
    </body>
</html>
